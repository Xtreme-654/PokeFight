    function carregarPokemons() {
        fetch('http://localhost:8080/pokemon/listar')
            .then(resposta => resposta.json())
            .then(pokemons => {
                const optionsHTML = pokemons
                    .map(poke => {
                        const id = poke.idPokemon ?? poke.id_pokemon;
                        const nome = poke.nomePokemon ?? poke.nome_pokemon;
                        const nomeFormatado = nome ? nome.toLowerCase() : '';
                        return `<option value="${id}" data-nome="${nomeFormatado}">${nome}</option>`;
                    })
                    .join('');

                const selects = document.querySelectorAll('.container select');
                selects.forEach(select => {
                    select.innerHTML = optionsHTML;
                });

                a_todas_imagens();
            })
    }

    function a_imagem(selectElement, imagem_pokemon) {
        const optionSelecionada = selectElement.options[selectElement.selectedIndex];
        const nomePokemon = optionSelecionada.getAttribute('data-nome');
        const imgElement = document.getElementById(imagem_pokemon);

        imgElement.src = `../Assets/pokemons_assets/${nomePokemon}.png`;
    }

    function a_todas_imagens() {
        a_imagem(document.getElementById('pokemon1'), 'img_pokemon1');

    }
